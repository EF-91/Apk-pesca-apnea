<!DOCTYPE html>
<html lang="it" data-theme="abissi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spot Apnea - Mappa e Dati Reali</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root[data-theme="abissi"] {
            --bg: #121212; --surface: #1e1e1e; --text: #ffffff;
            --accent: #0a84ff; --good: #32d74b; --mid: #ffd60a; --bad: #ff453a;
        }
        :root[data-theme="oceano"] {
            --bg: #001b2e; --surface: #003049; --text: #e0fbfc;
            --accent: #90e0ef; --good: #06d6a0; --mid: #ffd166; --bad: #ef476f;
        }
        :root[data-theme="tramonto"] {
            --bg: #2b1910; --surface: #4a2818; --text: #ffedd8;
            --accent: #f77f00; --good: #8ac926; --mid: #ffca3a; --bad: #d62828;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background-color: var(--bg); color: var(--text);
            margin: 0; padding: 20px 15px;
            display: flex; flex-direction: column; align-items: center;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        .theme-selector, .controls, .time-selector-container {
            width: 100%; max-width: 400px;
            display: flex; gap: 5px; margin-bottom: 15px;
        }

        select, .btn-action, .theme-btn {
            background-color: var(--surface); color: var(--text);
            border: 1px solid var(--accent); padding: 10px;
            border-radius: 6px; cursor: pointer;
        }
        
        .btn-action { background-color: var(--accent); color: #000; font-weight: bold; flex: 1; }
        .theme-btn { flex: 1; font-size: 12px; }
        select { flex: 1; outline: none; font-size: 14px; }

        #map {
            width: 100%; max-width: 400px; height: 250px;
            border-radius: 12px; margin-bottom: 20px;
            border: 2px solid var(--surface); z-index: 1;
        }

        .panel {
            background-color: var(--surface); border-radius: 12px;
            padding: 15px; width: 100%; max-width: 400px;
            box-sizing: border-box; margin-bottom: 15px;
        }

        .data-row {
            display: flex; justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding: 10px 0; font-size: 14px; align-items: center;
        }
        .data-row:last-child { border-bottom: none; }
        .val { font-weight: bold; color: var(--accent); text-align: right; max-width: 60%; }

        .result-panel { text-align: center; }
        .score-val { font-size: 42px; font-weight: bold; margin-top: 5px; }
        .score-lbl { font-size: 13px; opacity: 0.8; text-transform: uppercase; }
        
        #loading { display: none; color: var(--mid); font-size: 14px; margin-bottom: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="theme-selector">
        <button class="theme-btn" onclick="setTheme('abissi')">🌑 Abissi</button>
        <button class="theme-btn" onclick="setTheme('oceano')">🌊 Oceano</button>
        <button class="theme-btn" onclick="setTheme('tramonto')">🌅 Tramonto</button>
    </div>

    <div class="time-selector-container">
        <select id="time-selector">
            <option value="alba">Orario: Alba</option>
            <option value="mattina">Orario: Mattina</option>
            <option value="pomeriggio">Orario: Pomeriggio</option>
            <option value="tramonto">Orario: Tramonto</option>
        </select>
    </div>

    <div class="controls">
        <button class="btn-action" id="btn-gps">📍 Trova Posizione GPS</button>
    </div>

    <div id="loading">Analisi condizioni in corso...</div>
    <div id="map"></div>

    <div class="panel">
        <div class="data-row"><span>Condizioni Meteo</span> <span class="val" id="d-weather">N/D</span></div>
        <div class="data-row"><span>Vento</span> <span class="val" id="d-wind-name">N/D</span></div>
        <div class="data-row"><span>Altezza Onda</span> <span class="val" id="d-wave">N/D</span></div>
        <div class="data-row"><span>Forza Risacca</span> <span class="val" id="d-wave-force">N/D</span></div>
        <div class="data-row"><span>Temp. Esterna</span> <span class="val" id="d-air-temp">N/D</span></div>
        <div class="data-row"><span>Temp. Acqua (Stima)</span> <span class="val" id="d-water-temp">N/D</span></div>
        <div class="data-row"><span>Stile Consigliato</span> <span class="val" id="d-style" style="color: var(--good);">Seleziona spot</span></div>
    </div>

    <div class="panel result-panel">
        <div class="score-lbl" id="status-txt">Seleziona uno spot sulla mappa</div>
        <div class="score-val" id="score-display">-</div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        function setTheme(themeName) { document.documentElement.setAttribute('data-theme', themeName); }

        const map = L.map('map').setView([42.0, 15.0], 8);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18 }).addTo(map);
        let marker;

        const winds = ["Tramontana", "Grecale", "Levante", "Scirocco", "Ostro", "Libeccio", "Ponente", "Maestrale"];
        
        // Interpreta i codici meteo WMO standard
        function parseWeatherCode(code) {
            if(code === 0) return "Sereno ☀️";
            if(code > 0 && code < 4) return "Parz. Nuvoloso ⛅";
            if(code >= 45 && code <= 48) return "Nebbia / Foschia 🌫️";
            if(code >= 51 && code <= 67) return "Pioggia 🌧️";
            if(code >= 71) return "Neve / Forte maltempo ⛈️";
            return "Variabile";
        }

        // Restituisce un consiglio tattico in base all'orario
        function updateFishingStyle() {
            const time = document.getElementById('time-selector').value;
            const display = document.getElementById('d-style');
            if (time === 'alba') display.innerText = "Agguato e aspetto in acqua bassa";
            else if (time === 'mattina') display.innerText = "Pesca in tana o razzolo";
            else if (time === 'pomeriggio') display.innerText = "Aspetto a quote operative, caduta";
            else if (time === 'tramonto') display.innerText = "Aspetto in poca acqua, controluce";
        }

        // Aggiorna lo stile quando si cambia l'orario dal menu
        document.getElementById('time-selector').addEventListener('change', updateFishingStyle);

        // Calcola l'energia dell'onda basandosi su altezza e periodo
        function calculateWaveForce(height, period) {
            if (height === 0) return "Assente";
            const energy = height * period; 
            if (energy < 1) return "Molto debole (Calmo)";
            if (energy < 3) return "Moderata (Onda corta)";
            if (energy < 6) return "Forte (Risacca presente)";
            return "Pericolosa (Mare formato)";
        }

        async function fetchSpotData(lat, lng) {
            const loading = document.getElementById('loading');
            loading.style.display = 'block';
            
            try {
                // Fetch Meteo (Aggiunti temperature_2m e weather_code)
                const wRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current=wind_speed_10m,wind_direction_10m,temperature_2m,weather_code&wind_speed_unit=kn`);
                const wData = await wRes.json();
                
                // Fetch Dati Marini (Aggiunto wave_period)
                const mRes = await fetch(`https://marine-api.open-meteo.com/v1/marine?latitude=${lat}&longitude=${lng}&current=wave_height,wave_period`);
                const mData = await mRes.json();

                const windDir = wData.current.wind_direction_10m;
                const windSpeed = wData.current.wind_speed_10m;
                const airTemp = wData.current.temperature_2m;
                const weatherCode = wData.current.weather_code;
                
                const waveHeight = mData.current.wave_height || 0; 
                const wavePeriod = mData.current.wave_period || 0;

                // Stima approssimativa della temperatura dell'acqua in base a quella esterna
                const waterTempEstimate = (airTemp * 0.6) + 7;

                // Aggiornamento DOM
                document.getElementById('d-weather').innerText = parseWeatherCode(weatherCode);
                document.getElementById('d-wind-name').innerText = `${winds[Math.round(windDir / 45) % 8]} a ${windSpeed} kn`;
                document.getElementById('d-wave').innerText = waveHeight ? `${waveHeight.toFixed(1)} m` : 'N/D';
                document.getElementById('d-wave-force').innerText = calculateWaveForce(waveHeight, wavePeriod);
                document.getElementById('d-air-temp').innerText = `${airTemp}°C`;
                document.getElementById('d-water-temp').innerText = waveHeight > 0 ? `~${waterTempEstimate.toFixed(1)}°C` : 'N/D';
                
                updateFishingStyle();
                calculateScore(windSpeed, waveHeight);

            } catch (error) {
                alert('Errore API. Assicurati di selezionare un punto in mare aperto.');
            } finally {
                loading.style.display = 'none';
            }
        }

        function calculateScore(speed, wave) {
            let score = 100;
            if (speed > 5) score -= (speed * 1.5);
            if (speed > 15) score -= 30;
            if (wave > 0.3) score -= (wave * 20);
            if (wave > 1.2) score -= 40;

            score = Math.max(0, Math.min(100, Math.round(score)));
            
            const display = document.getElementById('score-display');
            const txt = document.getElementById('status-txt');
            display.innerText = `${score}%`;

            if (score >= 70) {
                display.style.color = 'var(--good)'; txt.innerText = 'Condizioni Ottimali';
            } else if (score >= 40) {
                display.style.color = 'var(--mid)'; txt.innerText = 'Condizioni Accettabili';
            } else {
                display.style.color = 'var(--bad)'; txt.innerText = 'Sconsigliato / Torbida';
            }
        }

        map.on('click', function(e) {
            const { lat, lng } = e.latlng;
            if (marker) map.removeLayer(marker);
            marker = L.marker([lat, lng]).addTo(map);
            fetchSpotData(lat, lng);
        });

        // Gestione avanzata errori GPS
        document.getElementById('btn-gps').addEventListener('click', () => {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    pos => {
                        const lat = pos.coords.latitude;
                        const lng = pos.coords.longitude;
                        map.setView([lat, lng], 12);
                        if (marker) map.removeLayer(marker);
                        marker = L.marker([lat, lng]).addTo(map);
                        fetchSpotData(lat, lng);
                    }, 
                    error => {
                        if(error.code === 1) {
                            alert("Permesso negato: controlla se stai aprendo il file in locale (file://) o se hai bloccato il GPS nel browser.");
                        } else {
                            alert("Errore nel rilevamento della posizione.");
                        }
                    }
                );
            }
        });
    </script>
</body>
</html>
