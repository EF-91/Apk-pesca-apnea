<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spot Apnea Pro - Radar</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-base: #07080a; --bg-panel: #13151a; --border-line: #22262d;
            --text-main: #f1f5f9; --text-muted: #94a3b8;
            --windy-blue: #0ea5e9; --windy-red: #ef4444; --windy-green: #10b981;
            --windy-warn: #eab308;
        }

        body {
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-base); color: var(--text-main);
            margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center;
            font-size: 13px;
        }

        .panel {
            width: 100%; max-width: 650px; background-color: var(--bg-panel);
            border: 1px solid var(--border-line); margin-bottom: 12px;
            box-sizing: border-box; overflow: hidden;
        }

        .panel-header {
            background-color: #1a1d24; padding: 10px 15px; font-size: 11px;
            text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted);
            border-bottom: 1px solid var(--border-line); display: flex; justify-content: space-between;
        }

        .panel-content { padding: 15px; }

        .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
        
        select, input[type="date"], input[type="text"], input[type="password"] {
            background-color: var(--bg-base); color: var(--text-main); border: 1px solid var(--border-line);
            padding: 8px; font-size: 13px; outline: none; -webkit-appearance: none; width: 100%;
            box-sizing: border-box; border-radius: 4px;
        }

        button { 
            background-color: #2563eb; color: #fff; font-weight: 600; cursor: pointer; border: none;
            padding: 10px; width: 100%; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px;
            border-radius: 4px;
        }
        button:active { background-color: #1d4ed8; }

        .gun-list { display: grid; grid-template-columns: 1fr; gap: 6px; font-size: 12px; max-height: 120px; overflow-y: auto; padding-right: 5px; }
        .gun-item { display: flex; align-items: center; gap: 8px; cursor: pointer; color: #cbd5e1; }
        
        #map { height: 280px; width: 100%; filter: contrast(1.1) saturate(1.1); }

        .data-grid { display: grid; grid-template-columns: auto 1fr; gap: 15px; align-items: stretch; margin-bottom: 15px; }
        .score-box { text-align: center; padding: 15px; border-right: 1px solid var(--border-line); }
        .score-val { font-size: 42px; font-weight: 700; line-height: 1; margin-bottom: 5px; }
        .score-lbl { font-size: 9px; text-transform: uppercase; color: var(--text-muted); letter-spacing: 1px; }

        .astro-box { font-size: 12px; line-height: 1.6; display: flex; flex-direction: column; justify-content: center; }
        .astro-row { display: flex; justify-content: space-between; border-bottom: 1px dashed var(--border-line); padding-bottom: 4px; margin-bottom: 4px; }

        .tactic-box { background-color: rgba(14, 165, 233, 0.05); padding: 10px; border-left: 2px solid var(--windy-blue); font-size: 12px; }

        .timeline-wrapper { overflow-x: auto; background-color: var(--bg-base); border-top: 1px solid var(--border-line); padding: 10px 0; }
        .t-row { display: flex; align-items: center; padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.03); }
        .t-label { width: 75px; flex-shrink: 0; font-size: 10px; color: var(--text-muted); padding-left: 10px; text-transform: uppercase; }
        .t-cell { width: 50px; flex-shrink: 0; text-align: center; font-size: 11px; font-variant-numeric: tabular-nums; }
        
        .update-indicator { color: var(--windy-green); font-size: 9px; animation: blink 2s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        .leaflet-control-layers { background-color: var(--bg-panel) !important; color: var(--text-main) !important; border: 1px solid var(--border-line) !important; border-radius: 4px !important; }
        .leaflet-control-layers-list { font-size: 12px; }

        /* Stili Database Pesci */
        .fish-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
        .fish-card { background-color: var(--bg-base); border: 1px solid var(--border-line); border-radius: 6px; overflow: hidden; display: flex; flex-direction: column; }
        .fish-img-container { width: 100%; height: 160px; background-color: #1a1d24; display: flex; align-items: center; justify-content: center; overflow: hidden; border-bottom: 1px solid var(--border-line); padding: 10px; }
        .fish-img-container img { width: 90%; height: 100%; object-fit: contain; display: block; filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.5)); }
        .fish-info { padding: 15px; font-size: 12px; line-height: 1.6; color: var(--text-muted); }
        .fish-title { color: var(--text-main); font-size: 15px; font-weight: bold; margin-bottom: 8px; text-transform: uppercase; border-bottom: 1px solid var(--border-line); padding-bottom: 6px; }
        .fish-data span { color: var(--windy-blue); font-weight: 600; }
        .fish-data-row { margin-bottom: 4px; display: flex; flex-direction: column; }
    </style>
</head>
<body>

    <div class="panel" style="margin-bottom: 8px;">
        <button id="btn-gps">📍 Radar Posizione</button>
    </div>
    
    <div class="panel" style="padding:0; border: none;">
        <div id="map"></div>
    </div>

    <div class="panel">
        <div class="panel-header">Parametri di Missione</div>
        <div class="panel-content">
            <div class="input-grid">
                <input type="date" id="target-date" style="grid-column: span 2;">
                <select id="time-start"></select>
                <select id="time-end"></select>
                <select id="depth-selector" style="grid-column: span 2;">
                    <option value="basso" selected>Quota: 0-5m (Risacca/Schiuma)</option>
                    <option value="medio">Quota: 5-15m (Razzolo/Ciglio)</option>
                    <option value="profondo">Quota: 15m+ (Profondo/Blu)</option>
                </select>
            </div>
            <div style="font-size:10px; color:var(--windy-blue); margin-bottom:5px; text-transform:uppercase;">Arsenale (Associazione Arma/Tecnica)</div>
            <div class="gun-list" id="gun-inventory"></div>
        </div>
    </div>

    <div class="panel" id="advice-box">
        <div class="panel-content" style="text-align: center; color: var(--text-muted); font-size: 12px;">
            In attesa di coordinate radar...
        </div>
    </div>

    <div class="panel" id="forecast-container" style="display: none; padding: 0;">
        <div class="panel-header">
            <span>Dati Oceanografici Alta Precisione</span>
            <span class="update-indicator" id="update-timer">Sync attivo</span>
        </div>
        <div class="timeline-wrapper" id="timeline"></div>
    </div>

    <!-- PANNELLO: Database Specie Mediterraneo -->
    <div class="panel" id="fish-database-panel">
        <div class="panel-header">Database Specie Mediterraneo</div>
        <div class="panel-content">
            <div class="fish-grid" id="fish-grid"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const STORMGLASS_API_KEY = "e130086e-a827-11f1-9cea-0242ac120004-e1300904-a827-11f1-9cea-0242ac120004";

        const startSelect = document.getElementById('time-start');
        const endSelect = document.getElementById('time-end');
        for(let i = 5; i <= 20; i++) {
            let hourStr = i.toString().padStart(2, '0') + ":00";
            startSelect.innerHTML += `<option value="${i}">${hourStr} (Inizio)</option>`;
            endSelect.innerHTML += `<option value="${i}">${hourStr} (Fine)</option>`;
        }
        startSelect.value = "6";
        endSelect.value = "12";

        const map = L.map('map', { zoomControl: false }).setView([39.81, 15.78], 14);
        const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 18 });
        const openSeaMapLayer = L.tileLayer('https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png', { maxZoom: 18 });
        
        satelliteLayer.addTo(map);
        L.control.layers({ "Satellitare": satelliteLayer }, { "Isobate (Nautiche)": openSeaMapLayer }, { position: 'topleft' }).addTo(map);

        let marker;
        const dateInput = document.getElementById('target-date');
        const today = new Date();
        dateInput.value = today.toISOString().split('T')[0];
        dateInput.min = dateInput.value;

        const allGuns = [
            { id: "ares85", name: "Salvimar Ares 85", techniques: ["agguato", "razzolo"], checked: true },
            { id: "pred75", name: "Salvimar Predathor 75", techniques: ["tana", "schiuma"], checked: true },
            { id: "pred100", name: "Salvimar Predathor 100", techniques: ["aspetto", "caduta"], checked: true },
            { id: "cher90", name: "Cressi Cherokee 90", techniques: ["agguato", "aspetto"], checked: false },
            { id: "snip95", name: "Pathos Sniper 95", techniques: ["aspetto", "caduta"], checked: false },
            { id: "cay75", name: "Omer Cayman 75", techniques: ["tana", "schiuma"], checked: false },
            { id: "carb115", name: "C4 Mr. Carbon 115", techniques: ["aspetto", "blu"], checked: false }
        ];

        let currentSpotData = null; 

        function renderGuns() {
            const container = document.getElementById('gun-inventory');
            container.innerHTML = allGuns.map(gun => `
                <label class="gun-item"><input type="checkbox" value="${gun.id}" class="gun-cb" ${gun.checked ? 'checked' : ''}>${gun.name} <span style="font-size:9px; color:var(--text-muted);">(${gun.techniques.join(', ')})</span></label>
            `).join('');
            document.querySelectorAll('.gun-cb').forEach(cb => { cb.addEventListener('change', updateAdvice); });
        }
        renderGuns();

        // --- MOTORE DI GENERAZIONE VETTORIALE (Nessun link esterno) ---
        function getFishSVG(type) {
            let rx=80, ry=25, cTop='#94a3b8', cBot='#e2e8f0', fCol='#64748b', tail='30,50 5,20 15,50 5,80', dorsal='60,25 100,10 130,25', eyeX=160, eyeY=40, mouthX=180, mouthY=45, extra='';
            
            switch(type) {
                case 'spigola': 
                    rx=85; ry=22; mouthX=185; 
                    break;
                case 'orata': 
                    rx=70; ry=35; eyeX=150; mouthX=170; cTop='#cbd5e1'; cBot='#f8fafc'; 
                    extra="<ellipse cx='160' cy='42' rx='6' ry='12' fill='#fbbf24' opacity='0.8'/>"; // Macchia oro
                    break;
                case 'sarago': 
                    rx=65; ry=35; eyeX=145; mouthX=165; cTop='#cbd5e1'; cBot='#f1f5f9';
                    extra="<path d='M80 15 L80 85 M100 15 L100 85 M120 18 L120 82' stroke='#1e293b' stroke-width='6' opacity='0.7'/>"; // Strisce verticali
                    break;
                case 'dentice': 
                    rx=75; ry=30; eyeX=155; mouthX=175; cTop='#fca5a5'; cBot='#fee2e2'; fCol='#f87171'; // Tonalità rosa/rossa
                    extra="<path d='M175 45 L172 48' stroke='white' stroke-width='2'/>"; // Denti visibili
                    break;
                case 'cernia': 
                    rx=70; ry=35; eyeX=150; mouthX=170; mouthY=48; cTop='#78350f'; cBot='#b45309'; fCol='#451a03'; // Marrone scuro
                    tail='30,50 10,25 5,50 10,75'; // Coda arrotondata
                    extra="<circle cx='90' cy='40' r='3' fill='#fcd34d' opacity='0.6'/><circle cx='110' cy='60' r='4' fill='#fcd34d' opacity='0.6'/><circle cx='60' cy='50' r='2' fill='#fcd34d' opacity='0.6'/>"; // Macchioline
                    break;
                case 'ricciola': 
                    rx=90; ry=25; eyeX=170; mouthX=190; cTop='#94a3b8'; cBot='#f8fafc'; fCol='#cbd5e1';
                    tail='30,50 0,10 15,50 0,90'; // Coda molto biforcuta
                    extra="<path d='M40 50 Q100 45 170 45' stroke='#fde047' stroke-width='5' opacity='0.9' fill='none'/>"; // Linea gialla laterale
                    break;
                case 'corvina': 
                    rx=70; ry=30; eyeX=150; mouthX=170; cTop='#451a03'; cBot='#78350f'; fCol='#fbbf24'; // Dorso curvo, bronzo, pinne gialle
                    dorsal='50,25 90,5 130,25'; 
                    break;
                case 'dorata': 
                    rx=70; ry=32; eyeX=150; mouthX=170; cTop='#b45309'; cBot='#f59e0b'; fCol='#78350f'; tail='30,50 10,25 5,50 10,75';
                    extra="<path d='M50 30 Q100 30 150 40 M45 50 Q100 50 140 60' stroke='#78350f' stroke-width='4' opacity='0.5' fill='none'/>";
                    break;
                case 'dotto': 
                    rx=75; ry=28; eyeX=155; mouthX=175; cTop='#3f3f46'; cBot='#71717a'; fCol='#27272a'; tail='30,50 10,25 5,50 10,75'; // Grigio scuro
                    break;
                case 'pappagallo': 
                    rx=65; ry=30; eyeX=145; mouthX=165; cTop='#ef4444'; cBot='#fde047'; fCol='#3b82f6'; // Rosso, giallo, pinne blu
                    extra="<path d='M165 45 Q160 50 165 55 Z' fill='#f8fafc' stroke='#1e293b'/>"; // Becco evidente
                    break;
                case 'leccia': 
                    rx=75; ry=35; eyeX=155; mouthX=175; cTop='#cbd5e1'; cBot='#ffffff'; fCol='#94a3b8';
                    tail='30,50 -5,5 15,50 -5,95'; // Coda a rondine estrema
                    dorsal='90,15 110,5 120,15';
                    break;
                case 'cefalo': 
                    rx=85; ry=20; eyeX=165; mouthX=185; cTop='#64748b'; cBot='#cbd5e1'; fCol='#94a3b8'; // Corpo dritto a siluro
                    break;
            }

            let svgStr = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 100'>
                <defs>
                    <linearGradient id='grad${type}' x1='0%' y1='0%' x2='0%' y2='100%'>
                        <stop offset='0%' style='stop-color:${cTop};stop-opacity:1' />
                        <stop offset='100%' style='stop-color:${cBot};stop-opacity:1' />
                    </linearGradient>
                </defs>
                <polygon points='${tail}' fill='url(#grad${type})' stroke='#1e293b' stroke-width='2'/>
                <polygon points='${dorsal}' fill='${fCol}' stroke='#1e293b' stroke-width='2'/>
                <polygon points='60,75 80,90 90,75' fill='${fCol}' stroke='#1e293b' stroke-width='2'/>
                <ellipse cx='100' cy='50' rx='${rx}' ry='${ry}' fill='url(#grad${type})' stroke='#1e293b' stroke-width='2'/>
                ${extra}
                <circle cx='${eyeX}' cy='${eyeY}' r='4' fill='#f8fafc' stroke='#1e293b' stroke-width='1'/>
                <circle cx='${eyeX+1}' cy='${eyeY}' r='1.5' fill='#0f172a'/>
                <path d='M${mouthX} ${mouthY} Q${mouthX-5} ${mouthY+3} ${mouthX} ${mouthY+8}' stroke='#1e293b' stroke-width='2' fill='none'/>
                <path d='M125 55 Q110 65 115 50 Z' fill='${fCol}' stroke='#1e293b' stroke-width='1'/>
            </svg>`;
            
            return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svgStr);
        }

        const fishDatabase = [
            { 
                name: "Spigola (Branzino)", depth: "0 - 15m", period: "Autunno / Inverno", 
                habitat: "Risacca, foci dei fiumi, porti, fondali misti sabbia e posidonia.", 
                size: "25 cm", tactic: "Agguato in schiuma, aspetto in pochissima acqua.", 
                imageUrl: getFishSVG('spigola')
            },
            { 
                name: "Orata", depth: "1 - 30m", period: "Primavera / Autunno", 
                habitat: "Distese di sabbia e fango vicino a scogliere, allevamenti.", 
                size: "20 cm", tactic: "Aspetto nascosto sul fondo, agguato lento.", 
                imageUrl: getFishSVG('orata')
            },
            { 
                name: "Sarago Maggiore", depth: "0 - 40m", period: "Tutto l'anno", 
                habitat: "Spaccature profonde, franate, tane rocciose.", 
                size: "15 cm", tactic: "Pesca in tana con torcia corta, agguato profondo.", 
                imageUrl: getFishSVG('sarago')
            },
            { 
                name: "Dentice", depth: "15 - 50m+", period: "Estate / Inizio Autunno", 
                habitat: "Secche al largo, cigliate esposte alla corrente primaria.", 
                size: "Non spec. (Etico > 1kg)", tactic: "Aspetto profondo con prolungato immobilismo.", 
                imageUrl: getFishSVG('dentice')
            },
            { 
                name: "Cernia Bruna", depth: "10 - 50m+", period: "Piena Estate", 
                habitat: "Grandi tane rocciose, cunicoli complessi e bui, relitti.", 
                size: "45 cm", tactic: "Pesca in tana mirata alla testa o caduta mirata.", 
                imageUrl: getFishSVG('cernia')
            },
            { 
                name: "Ricciola", depth: "0 - 50m+", period: "Tarda Estate / Autunno", 
                habitat: "Acque libere (pelagico), promontori esposti a correnti.", 
                size: "60 cm (Consigliato > 2kg)", tactic: "Aspetto nel blu, caduta intercettando branchi in caccia.", 
                imageUrl: getFishSVG('ricciola')
            },
            { 
                name: "Corvina", depth: "10 - 40m", period: "Primavera / Estate", 
                habitat: "Grotte ampie, praterie di posidonia vicino a rocce.", 
                size: "30 cm", tactic: "Tana o agguato. Stazionano immobili all'ingresso di cavità.", 
                imageUrl: getFishSVG('corvina')
            },
            { 
                name: "Cernia Dorata (Dotto falso)", depth: "10 - 50m", period: "Estate / Autunno", 
                habitat: "Scogliere isolate, franate di massi su sabbia.", 
                size: "45 cm", tactic: "Si stacca dal fondo. Ideale caduta o agguato profondo.", 
                imageUrl: getFishSVG('dorata')
            },
            { 
                name: "Dotto", depth: "15 - 50m+", period: "Estate / Inizio Autunno", 
                habitat: "Cadute nel blu, grandi scogli isolati.", 
                size: "45 cm", tactic: "Diffidente, richiede aspetti lunghi e ben occultati.", 
                imageUrl: getFishSVG('dotto')
            },
            { 
                name: "Pesce Pappagallo", depth: "1 - 30m", period: "Estate", 
                habitat: "Fondali rocciosi superficiali e zone ricche di alghe.", 
                size: "Nessuna spec. (> 30cm)", tactic: "Agguato tra gli scogli in poca acqua.", 
                imageUrl: getFishSVG('pappagallo')
            },
            { 
                name: "Leccia", depth: "0 - 20m", period: "Primavera / Fine Estate", 
                habitat: "Foci, coste sabbiose e scogliere basse alla ricerca di branchi.", 
                size: "60 cm (Consigliato > 3kg)", tactic: "Aspetto dinamico. Richiede un tiro potente.", 
                imageUrl: getFishSVG('leccia')
            },
            { 
                name: "Cefalo (Muggine)", depth: "0 - 10m", period: "Tutto l'anno", 
                habitat: "Acque torbide, porti, foci, zona di forte risacca.", 
                size: "20 cm", tactic: "Agguato in pochissima acqua o aspetto breve nella schiuma.", 
                imageUrl: getFishSVG('cefalo')
            }
        ];

        function renderFishDatabase() {
            const container = document.getElementById('fish-grid');
            container.innerHTML = fishDatabase.map(fish => {
                return `
                    <div class="fish-card">
                        <div class="fish-img-container">
                            <img src="${fish.imageUrl}" alt="${fish.name}">
                        </div>
                        <div class="fish-info">
                            <div class="fish-title">${fish.name}</div>
                            <div class="fish-data-row">Quota Operativa: <span>${fish.depth}</span></div>
                            <div class="fish-data-row">Stagione Ottimale: <span>${fish.period}</span></div>
                            <div class="fish-data-row">Habitat: <span style="color:var(--text-main); font-weight:normal;">${fish.habitat}</span></div>
                            <div class="fish-data-row">Approccio: <span style="color:var(--text-main); font-weight:normal;">${fish.tactic}</span></div>
                            <div class="fish-data-row" style="margin-top:6px;">Taglia Minima Legale: <span style="color:var(--windy-red);">${fish.size}</span></div>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        renderFishDatabase();

        // --- GESTIONE RADAR E PREVISIONI ---
        startSelect.addEventListener('change', updateAdvice);
        endSelect.addEventListener('change', updateAdvice);
        document.getElementById('depth-selector').addEventListener('change', updateAdvice);
        dateInput.addEventListener('change', () => { if(marker) fetchSpotData(marker.getLatLng().lat, marker.getLatLng().lng); });

        function parseWeather(code) {
            if(code <= 1) return "☀️"; if(code <= 3) return "⛅";
            if(code <= 48) return "🌫"; if(code <= 67) return "🌧"; return "⛈";
        }

        function getDirectionArrow(degrees) {
            if (degrees === null || degrees === undefined) return "-";
            const arrows = ["⬇", "↙", "⬅", "↖", "⬆", "↗", "➡", "↘"];
            return arrows[Math.round(degrees / 45) % 8];
        }

        function getWindDirectionName(degrees) {
            if (degrees === null || degrees === undefined) return "";
            const sectors = ["N (Tramontana)", "NE (Grecale)", "E (Levante)", "SE (Scirocco)", "S (Ostro)", "SO (Libeccio)", "O (Ponente)", "NO (Maestrale)"];
            return sectors[Math.round(degrees / 45) % 8];
        }

        function getMoonData(date) {
            let year = date.getFullYear(), month = date.getMonth() + 1, day = date.getDate();
            if (month < 3) { year--; month += 12; }
            let a = Math.floor(year / 100), b = Math.floor(a / 4), c = 2 - a + b;
            let jd = c + day + Math.floor(365.25 * (year + 4716)) + Math.floor(30.6001 * (month + 1)) - 1524.5;
            let age = ((jd - 2451549.5) / 29.53) % 1 * 29.53;
            let phase = "";
            if (age < 2 || age > 27) phase = "Nuova 🌑";
            else if (age < 13) phase = "Crescente 🌓";
            else if (age < 17) phase = "Piena 🌕";
            else phase = "Calante 🌗";
            return { age: age, phase: phase };
        }

        function getTargetSpeciesArray(depth, month) {
            const isWarm = (month >= 5 && month <= 10);
            if (depth === "basso") return isWarm ? ["Cefalo", "Sarago", "Spigola", "Salpa"] : ["Spigola", "Polpo", "Cefalo"];
            else if (depth === "medio") return isWarm ? ["Orata", "Corvina", "Serra", "Dentice"] : ["Sarago", "Tordo", "Corvina"];
            return isWarm ? ["Dentice", "Ricciola", "Cernia", "Palamita"] : ["Cernia", "Ricciola", "Dentice"];
        }

        function calculateRoundedScore(startH, endH, depth, waveAvg, windAvg) {
            let score = 50; 
            if (startH <= 7 || endH >= 18) score += 20; 
            if (depth === "basso") {
                if (waveAvg >= 0.3 && waveAvg <= 0.8) score += 25; 
                else if (waveAvg < 0.2) score -= 15; else if (waveAvg > 1.2) score -= 30; 
            } else if (depth === "medio") {
                if (waveAvg <= 0.5) score += 15; else if (waveAvg > 1.0) score -= 25;
            } else {
                if (waveAvg < 0.4) score += 20; else if (waveAvg > 0.8) score -= 35; 
            }
            if (windAvg > 15) score -= 20;
            return Math.round(Math.max(0, Math.min(100, score)) / 5) * 5; 
        }

        function updateAdvice() {
            if (!marker || !currentSpotData) return; 
            const startH = parseInt(document.getElementById('time-start').value);
            let endH = parseInt(document.getElementById('time-end').value);
            if (endH <= startH) endH = startH + 1; 
            const depth = document.getElementById('depth-selector').value;
            
            const targetDateObj = new Date(dateInput.value);
            const moonData = getMoonData(targetDateObj);
            const selectedGunIds = Array.from(document.querySelectorAll('.gun-cb:checked')).map(cb => cb.value);
            const selectedGuns = allGuns.filter(g => selectedGunIds.includes(g.id));

            let htmlOutput = "";
            let warningBanner = "";

            if (currentSpotData.isFallback) {
                warningBanner = `
                <div style="background-color: rgba(234, 179, 8, 0.15); border: 1px solid var(--windy-warn); color: var(--windy-warn); padding: 8px; border-radius: 4px; font-size: 11px; margin-bottom: 10px; text-align: left;">
                    ⚠️ Punto chiuso. Onde stimate in base al vento locale.
                </div>`;
            }

            if (selectedGuns.length === 0) {
                htmlOutput = "Nessuna arma selezionata nell'inventario.";
            } else {
                let duration = endH - startH;
                let midTime = Math.floor((startH + endH) / 2);

                let waveSum1 = 0, windSum1 = 0, count1 = 0;
                let waveSum2 = 0, windSum2 = 0, count2 = 0;

                for(let i = startH; i < endH; i++) { 
                    let w = 0;
                    let wind = currentSpotData.winds[i] || 0;
                    if (currentSpotData.isFallback) {
                        if (wind < 5) w = 0.1; else if (wind < 12) w = 0.4; else w = 1.0;
                    } else {
                        w = (currentSpotData.waves[i] !== undefined && currentSpotData.waves[i] !== null) ? currentSpotData.waves[i] : 0;
                    }

                    if (i < midTime || duration <= 3) {
                        waveSum1 += w; windSum1 += wind; count1++;
                    } else {
                        waveSum2 += w; windSum2 += wind; count2++;
                    }
                }
                
                let wave1 = count1 > 0 ? waveSum1 / count1 : 0;
                let wind1 = count1 > 0 ? windSum1 / count1 : 0;
                let wave2 = count2 > 0 ? waveSum2 / count2 : 0;
                let wind2 = count2 > 0 ? windSum2 / count2 : 0;

                let totalWaveAvg = (wave1 + wave2) / (count2 > 0 ? 2 : 1);
                let totalWindAvg = (wind1 + wind2) / (count2 > 0 ? 2 : 1);
                let finalScore = calculateRoundedScore(startH, endH, depth, totalWaveAvg, totalWindAvg);
                let scoreColor = finalScore < 45 ? 'var(--windy-red)' : (finalScore <= 70 ? 'var(--windy-warn)' : 'var(--windy-green)');

                const techDetails = {
                    "agguato": "Avvicinati alla preda strisciando sul fondo o dietro i ripari naturali. Sfrutta il fondale per non farti vedere, ideale quando c'è poco moto ondoso.",
                    "aspetto": "Immobilizzati sul fondo curando l'occultamento. Attendi che i predatori o i pesci di passaggio si avvicinino spinti dalla curiosità.",
                    "schiuma": "Muoviti velocemente nel frangente e dove sbatte l'onda. L'acqua mossa e ossigenata copre i tuoi movimenti attirando i predatori a caccia.",
                    "razzolo": "Ispeziona metodicamente il fondo alternando brevi aspetti a spostamenti dinamici tra le rocce e i cigli per scovare le prede.",
                    "tana": "Pesca ravvicinata nelle spaccature della roccia. Usa la torcia per ispezionare anfratti bui dove il pesce si ripara dalla corrente."
                };

                function getTactics(waveAvg) {
                    if (waveAvg <= 0.3) return depth === "basso" ? { tech: "agguato", cond: "Mare piatto" } : { tech: "aspetto", cond: "Calma e acqua limpida" };
                    if (waveAvg <= 0.7) return depth === "basso" ? { tech: "schiuma", cond: "Risacca attiva" } : { tech: "razzolo", cond: "Acqua mossa in superficie" };
                    return { tech: "tana", cond: "Condizioni difficili o mare mosso" };
                }

                htmlOutput += `
                    <div class="data-grid">
                        <div class="score-box">
                            <div class="score-val" style="color:${scoreColor}">${finalScore}%</div>
                            <div class="score-lbl">Pescosità</div>
                        </div>
                        <div class="astro-box">
                            <div class="astro-row"><span>🌅 Alba</span> <span>${currentSpotData.sunriseTime}</span></div>
                            <div class="astro-row"><span>🌇 Tramonto</span> <span>${currentSpotData.sunsetTime}</span></div>
                            <div class="astro-row"><span>🌙 Luna</span> <span>${moonData.phase}</span></div>
                            <div class="astro-row" style="border:none; color:var(--windy-blue);">
                                <span>🐟 Target</span> <span style="text-align:right;">${getTargetSpeciesArray(depth, targetDateObj.getMonth()).join(", ")}</span>
                            </div>
                        </div>
                    </div>
                    ${warningBanner}
                `;

                if (duration <= 3) {
                    let t = getTactics((wave1 + wave2) / 2);
                    let gun = selectedGuns.find(g => g.techniques.includes(t.tech)) || selectedGuns[0];
                    let isFb = !gun.techniques.includes(t.tech);
                    let borderCol = isFb ? "var(--windy-red)" : "var(--windy-green)";
                    let bgCol = isFb ? "rgba(239, 68, 68, 0.1)" : "rgba(16, 185, 129, 0.1)";

                    htmlOutput += `
                        <div class="tactic-box">
                            <div style="margin-bottom:8px;"><b>Condizioni:</b> ${t.cond}.</div>
                            <div style="margin-bottom:12px; font-size:11px; color:var(--text-muted);"><b>Come agire:</b> ${techDetails[t.tech]}</div>
                            <div style="padding: 8px; border: 1px ${isFb ? 'dashed' : 'solid'} ${borderCol}; border-radius: 4px; background: ${bgCol};">
                                <b>${isFb ? 'Arma di Ripiego' : 'Arma Perfetta'}: ${gun.name}</b><br>
                                <span style="font-size: 10px; color: ${borderCol};">${isFb ? 'Adattamento necessario' : 'Ottimizzata per: ' + t.tech.toUpperCase()}</span>
                            </div>
                        </div>
                    `;
                } else {
                    let t1 = getTactics(wave1);
                    let t2 = getTactics(wave2);

                    let gun1 = selectedGuns.find(g => g.techniques.includes(t1.tech)) || selectedGuns[0];
                    let gun2 = selectedGuns.find(g => g.techniques.includes(t2.tech) && g.id !== gun1.id) || selectedGuns.find(g => g.techniques.includes(t2.tech)) || selectedGuns[selectedGuns.length - 1];

                    let isFb1 = !gun1.techniques.includes(t1.tech);
                    let isFb2 = !gun2.techniques.includes(t2.tech);

                    htmlOutput += `
                        <div class="tactic-box" style="text-align:left;">
                            <div style="margin-bottom:10px; font-weight:600; color:var(--windy-blue);">Sessione lunga (${duration} ore). Pianificazione tattica:</div>
                            
                            <div style="margin-bottom:12px; padding: 10px; border-left: 3px solid var(--windy-blue); background: rgba(14, 165, 233, 0.05);">
                                <b style="color:var(--text-main); font-size:13px;">Fase 1 (${startH}:00 - ${midTime}:00)</b><br>
                                <span style="color:var(--windy-blue); font-weight:bold; font-size:11px;">Tecnica: ${t1.tech.toUpperCase()}</span><br>
                                <span style="font-size:11px; display:block; margin:4px 0;">${techDetails[t1.tech]}</span>
                                <span style="color:${isFb1 ? 'var(--windy-red)' : 'var(--windy-green)'}; font-weight:bold;">🎯 Arma: ${gun1.name}</span>
                            </div>

                            <div style="padding: 10px; border-left: 3px solid var(--windy-blue); background: rgba(14, 165, 233, 0.05);">
                                <b style="color:var(--text-main); font-size:13px;">Fase 2 (${midTime}:00 - ${endH}:00)</b><br>
                                <span style="color:var(--windy-blue); font-weight:bold; font-size:11px;">Tecnica: ${t2.tech.toUpperCase()}</span><br>
                                <span style="font-size:11px; display:block; margin:4px 0;">${techDetails[t2.tech]}</span>
                                <span style="color:${isFb2 ? 'var(--windy-red)' : 'var(--windy-green)'}; font-weight:bold;">🎯 Arma: ${gun2.name}</span>
                            </div>
                        </div>
                    `;
                }
            }

            document.getElementById('advice-box').innerHTML = `
                <div class="panel-header" style="background-color: transparent; border-bottom: 1px solid var(--border-line); margin-bottom:10px;">
                    <span style="color:var(--windy-blue);">${currentSpotData.placeName}</span>
                </div>
                <div class="panel-content" style="padding-top:0;">
                    ${htmlOutput}
                </div>
            `;
        }

        async function getValidMarineData(baseLat, baseLng, sDate) {
            const offsets = [
                [0, 0], [0, -0.05], [0, 0.05], [-0.05, 0], [0.05, 0], 
                [-0.05, -0.05], [0.05, -0.05], [0, -0.1], [0, 0.1], [-0.1, -0.1]
            ];
            for (let off of offsets) {
                let testLat = baseLat + off[0];
                let testLng = baseLng + off[1];
                try {
                    let res = await fetch(`https://marine-api.open-meteo.com/v1/marine?latitude=${testLat}&longitude=${testLng}&hourly=wave_height,wave_direction,wave_period&timezone=auto&start_date=${sDate}&end_date=${sDate}`);
                    if (!res.ok) continue; 
                    let data = await res.json();
                    if (data.hourly && data.hourly.wave_height) {
                        if (data.hourly.wave_height.some(val => val !== null)) return data; 
                    }
                } catch(e) {}
            }
            return null; 
        }

        async function getProTides(lat, lng, sDate) {
            let cacheKey = `tide_${Math.round(lat*10)/10}_${Math.round(lng*10)/10}_${sDate}`;
            let cachedDataStr = localStorage.getItem(cacheKey);
            
            if (cachedDataStr) {
                let cachedData = JSON.parse(cachedDataStr);
                let now = new Date().getTime();
                let savedTime = cachedData.timestamp || 0;
                let timeDiffMinutes = (now - savedTime) / (1000 * 60);

                if (timeDiffMinutes < 144) {
                    return cachedData.data;
                }
            }

            try {
                let dStart = new Date(sDate); dStart.setDate(dStart.getDate() - 1);
                let dEnd = new Date(sDate); dEnd.setDate(dEnd.getDate() + 2);
                let startIso = dStart.toISOString().split('T')[0];
                let endIso = dEnd.toISOString().split('T')[0];
                
                let res = await fetch(`https://api.stormglass.io/v2/tide/extremes/point?lat=${lat}&lng=${lng}&start=${startIso}&end=${endIso}`, {
                    headers: { 'Authorization': STORMGLASS_API_KEY }
                });
                
                if (res.ok) {
                    let json = await res.json();
                    if(json.data) {
                        let cacheObject = {
                            timestamp: new Date().getTime(),
                            data: json.data
                        };
                        localStorage.setItem(cacheKey, JSON.stringify(cacheObject));
                        return json.data;
                    }
                }
            } catch(e) {}
            return null;
        }

        async function fetchSpotData(lat, lng) {
            const dateObj = new Date(dateInput.value);
            const sDate = dateInput.value;
            const moonData = getMoonData(dateObj); 

            document.getElementById('forecast-container').style.display = 'none';
            document.getElementById('advice-box').innerHTML = "<div class='panel-content' style='text-align:center; color: var(--windy-blue); font-size: 11px;'>📡 Scansione parametri e calcolo maree PRO in corso...</div>";
            
            try {
                let placeName = "Coordinate Radar";
                try {
                    const geoRes = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json`);
                    const geoData = await geoRes.json();
                    placeName = geoData.name || geoData.address.village || geoData.address.town || "Zona Costiera";
                } catch(e) {}

                const wRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&hourly=wind_speed_10m,wind_direction_10m,wind_gusts_10m,weather_code&daily=sunrise,sunset&timezone=auto&start_date=${sDate}&end_date=${sDate}&wind_speed_unit=kn&models=best_match`);
                const wData = await wRes.json();
                
                let mData = await getValidMarineData(lat, lng, sDate);
                
                let tideExtremes = await getProTides(lat, lng, sDate);

                let isFallback = false;
                if (!mData) {
                    isFallback = true;
                    mData = { hourly: { wave_height: new Array(24).fill(null), wave_direction: new Array(24).fill(null), wave_period: new Array(24).fill(null) } };
                }

                let srTime = "-", ssTime = "-";
                if(wData.daily && wData.daily.sunrise) srTime = new Date(wData.daily.sunrise[0]).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                if(wData.daily && wData.daily.sunset) ssTime = new Date(wData.daily.sunset[0]).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

                currentSpotData = {
                    placeName: placeName, isFallback: isFallback,
                    sDateStr: sDate, 
                    winds: wData.hourly.wind_speed_10m, weather: wData.hourly.weather_code,
                    sunriseTime: srTime, sunsetTime: ssTime,
                    waves: mData.hourly.wave_height, waveDir: mData.hourly.wave_direction, wavePeriod: mData.hourly.wave_period,
                    tideExtremes: tideExtremes, moonAge: moonData.age 
                };

                if (marker) map.removeLayer(marker);
                
                const startH = parseInt(document.getElementById('time-start').value);
                const windDirVal = wData.hourly.wind_direction_10m[startH] || 0;
                let windName = getWindDirectionName(windDirVal);
                let currentArrow = isFallback || mData.hourly.wave_direction[startH] === null ? "-" : getDirectionArrow(mData.hourly.wave_direction[startH]);

                let popupContent = `<div style="font-size:11px;"><b>${placeName}</b><br>Vento: ${windName}<br>Mare: ${currentArrow}</div>`;
                marker = L.marker([lat, lng]).bindPopup(popupContent).addTo(map);
                marker.openPopup();

                buildTimeline(currentSpotData);
                document.getElementById('forecast-container').style.display = 'block';
                updateAdvice(); 

            } catch (error) {
                document.getElementById('advice-box').innerHTML = "<div class='panel-content' style='text-align:center; color: var(--windy-red); font-size: 11px;'>Errore di rete. Riprova.</div>";
            }
        }

        function buildTimeline(data) {
            const container = document.getElementById('timeline');
            let isProTide = data.tideExtremes !== null;

            let rowTime = '<div class="t-row"><div class="t-label">Ora</div>';
            let rowMeteo = '<div class="t-row"><div class="t-label">Cielo</div>';
            let rowWind = '<div class="t-row"><div class="t-label">Vento (kn)</div>';
            let rowWave = '<div class="t-row"><div class="t-label">Onda (m)</div>';
            let rowPeriod = '<div class="t-row"><div class="t-label">Period (s)</div>';
            let rowTide = `<div class="t-row" style="border:none;"><div class="t-label">${isProTide ? 'Marea (PRO)' : 'Marea (Luna)'}</div>`;

            let dateParts = data.sDateStr.split('-');

            for (let i = 5; i <= 20; i++) {
                let timeStr = i.toString().padStart(2, '0') + ':00';
                let icon = parseWeather(data.weather[i]);
                let windSp = Math.round(data.winds[i]);
                
                let waveH = (data.waves[i] !== null && data.waves[i] !== undefined) ? data.waves[i].toFixed(1) : '-';
                let dirArrow = getDirectionArrow(data.waveDir[i]);
                let period = (data.waves[i] !== null && data.wavePeriod[i] !== null) ? Math.round(data.wavePeriod[i]) + 's' : '-';
                
                let tideStr = "-";
                if (isProTide) {
                    let targetDate = new Date(dateParts[0], dateParts[1] - 1, dateParts[2], i, 0, 0);
                    let targetMs = targetDate.getTime();
                    
                    let nextExtreme = data.tideExtremes.find(ex => new Date(ex.time).getTime() > targetMs);
                    if (nextExtreme) {
                        if (nextExtreme.type === "high") {
                            tideStr = "<span style='color:var(--windy-blue); font-weight:bold;'>🌊 IN</span>";
                        } else {
                            tideStr = "<span style='color:var(--windy-red); font-weight:bold;'>📉 OUT</span>";
                        }
                    }
                } else {
                    let lunarOffset = (data.moonAge * 24 * 0.84) % 12; 
                    let adjustedHour = (i - lunarOffset + 24) % 12;
                    if (adjustedHour < 6) tideStr = "<span style='color:var(--windy-blue); font-weight:bold;'>🌊 IN</span>";
                    else tideStr = "<span style='color:var(--windy-red); font-weight:bold;'>📉 OUT</span>";
                }

                rowTime += `<div class="t-cell" style="color:var(--text-main); font-weight:600;">${timeStr}</div>`;
                rowMeteo += `<div class="t-cell">${icon}</div>`;
                rowWind += `<div class="t-cell">${windSp}</div>`;
                rowWave += `<div class="t-cell" style="color:var(--windy-blue);">${waveH} ${dirArrow === '-' ? '' : dirArrow}</div>`;
                rowPeriod += `<div class="t-cell">${period}</div>`;
                rowTide += `<div class="t-cell" style="font-size:10px;">${tideStr}</div>`;
            }
            container.innerHTML = rowTime + '</div>' + rowMeteo + '</div>' + rowWind + '</div>' + rowWave + '</div>' + rowPeriod + '</div>' + rowTide + '</div>';
        }

        map.on('click', e => { 
            if (marker) map.removeLayer(marker); 
            marker = L.marker([e.latlng.lat, e.latlng.lng]).addTo(map); 
            fetchSpotData(e.latlng.lat, e.latlng.lng); 
        });
        
        document.getElementById('btn-gps').addEventListener('click', () => {
            if (navigator.geolocation) navigator.geolocation.getCurrentPosition(pos => {
                map.setView([pos.coords.latitude, pos.coords.longitude], 13);
                if (marker) map.removeLayer(marker); 
                marker = L.marker([pos.coords.latitude, pos.coords.longitude]).addTo(map);
                fetchSpotData(pos.coords.latitude, pos.coords.longitude);
            });
        });
    </script>
