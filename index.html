<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spot Apnea Pro - Radar</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-base: #07080a; --bg-panel: #13151a; --border-line: #22262d;
            --text-main: #f1f5f9; --text-muted: #94a3b8;
            --windy-blue: #0ea5e9; --windy-red: #ef4444; --windy-green: #10b981;
            --windy-warn: #eab308;
        }

        body {
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-base); color: var(--text-main);
            margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center;
            font-size: 13px;
        }

        .panel {
            width: 100%; max-width: 650px; background-color: var(--bg-panel);
            border: 1px solid var(--border-line); margin-bottom: 12px;
            box-sizing: border-box; overflow: hidden;
        }

        .panel-header {
            background-color: #1a1d24; padding: 10px 15px; font-size: 11px;
            text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted);
            border-bottom: 1px solid var(--border-line); display: flex; justify-content: space-between;
        }

        .panel-content { padding: 15px; }

        .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
        
        select, input[type="date"], input[type="text"], input[type="password"] {
            background-color: var(--bg-base); color: var(--text-main); border: 1px solid var(--border-line);
            padding: 8px; font-size: 13px; outline: none; -webkit-appearance: none; width: 100%;
            box-sizing: border-box; border-radius: 4px;
        }

        button { 
            background-color: #2563eb; color: #fff; font-weight: 600; cursor: pointer; border: none;
            padding: 10px; width: 100%; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px;
            border-radius: 4px;
        }
        button:active { background-color: #1d4ed8; opacity: 0.9; }

        .gun-list { display: grid; grid-template-columns: 1fr; gap: 6px; font-size: 12px; max-height: 120px; overflow-y: auto; padding-right: 5px; }
        .gun-item { display: flex; align-items: center; gap: 8px; cursor: pointer; color: #cbd5e1; }
        
        #map { height: 280px; width: 100%; filter: contrast(1.1) saturate(1.1); }

        .data-grid { display: grid; grid-template-columns: auto 1fr; gap: 15px; align-items: stretch; margin-bottom: 15px; }
        .score-box { text-align: center; padding: 15px; border-right: 1px solid var(--border-line); }
        .score-val { font-size: 42px; font-weight: 700; line-height: 1; margin-bottom: 5px; }
        .score-lbl { font-size: 9px; text-transform: uppercase; color: var(--text-muted); letter-spacing: 1px; }

        .astro-box { font-size: 12px; line-height: 1.6; display: flex; flex-direction: column; justify-content: center; }
        .astro-row { display: flex; justify-content: space-between; border-bottom: 1px dashed var(--border-line); padding-bottom: 4px; margin-bottom: 4px; }

        .tactic-box { background-color: rgba(14, 165, 233, 0.05); padding: 10px; border-left: 2px solid var(--windy-blue); font-size: 12px; }

        .timeline-wrapper { overflow-x: auto; background-color: var(--bg-base); border-top: 1px solid var(--border-line); padding: 10px 0; }
        .t-row { display: flex; align-items: center; padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.03); }
        .t-label { width: 75px; flex-shrink: 0; font-size: 10px; color: var(--text-muted); padding-left: 10px; text-transform: uppercase; }
        .t-cell { width: 50px; flex-shrink: 0; text-align: center; font-size: 11px; font-variant-numeric: tabular-nums; }
        
        .update-indicator { color: var(--windy-green); font-size: 9px; animation: blink 2s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        .leaflet-control-layers { background-color: var(--bg-panel) !important; color: var(--text-main) !important; border: 1px solid var(--border-line) !important; border-radius: 4px !important; }
        .leaflet-control-layers-list { font-size: 12px; }

        /* Stili Database Pesci */
        .fish-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
        .fish-card { background-color: var(--bg-base); border: 1px solid var(--border-line); border-radius: 6px; overflow: hidden; display: flex; flex-direction: column; }
        .fish-img-container { width: 100%; height: 160px; background-color: #1a1d24; display: flex; align-items: center; justify-content: center; overflow: hidden; border-bottom: 1px solid var(--border-line); padding: 10px; }
        .fish-img-container img { width: 100%; height: 100%; object-fit: contain; display: block; filter: drop-shadow(0px 8px 12px rgba(0,0,0,0.6)); }
        .fish-info { padding: 15px; font-size: 12px; line-height: 1.6; color: var(--text-muted); }
        .fish-title { color: var(--text-main); font-size: 15px; font-weight: bold; margin-bottom: 8px; text-transform: uppercase; border-bottom: 1px solid var(--border-line); padding-bottom: 6px; }
        .fish-data span { color: var(--windy-blue); font-weight: 600; }
        .fish-data-row { margin-bottom: 6px; display: flex; flex-direction: column; }
    </style>
</head>
<body>

    <div class="panel" style="margin-bottom: 8px;">
        <div class="input-grid" style="margin-bottom: 0;">
            <button id="btn-gps">📍 GPS</button>
            <button id="btn-save-spot" style="background-color: var(--windy-warn); color: #000;">⭐ Salva Spot</button>
        </div>
    </div>
    
    <div class="panel" style="padding:0; border: none;">
        <div id="map"></div>
    </div>

    <!-- PANNELLO: I Miei Spot Salvati -->
    <div class="panel" id="saved-spots-panel">
        <div class="panel-header" style="color:var(--windy-warn); background-color: rgba(234, 179, 8, 0.1);">I Miei Spot Salvati</div>
        <div class="panel-content" id="saved-spots-list" style="max-height: 250px; overflow-y: auto; padding: 10px;">
        </div>
    </div>

    <div class="panel">
        <div class="panel-header">Parametri di Missione</div>
        <div class="panel-content">
            <div class="input-grid">
                <input type="date" id="target-date" style="grid-column: span 2;">
                <select id="time-start"></select>
                <select id="time-end"></select>
                <select id="depth-selector" style="grid-column: span 2;">
                    <option value="basso" selected>Quota: 0-5m (Risacca/Schiuma)</option>
                    <option value="medio">Quota: 5-15m (Razzolo/Ciglio)</option>
                    <option value="profondo">Quota: 15m+ (Profondo/Blu)</option>
                </select>
            </div>
            <div style="font-size:10px; color:var(--windy-blue); margin-bottom:5px; text-transform:uppercase;">Arsenale (Associazione Arma/Tecnica)</div>
            <div class="gun-list" id="gun-inventory"></div>
        </div>
    </div>

    <div class="panel" id="advice-box">
        <div class="panel-content" style="text-align: center; color: var(--text-muted); font-size: 12px;">
            In attesa di coordinate radar...
        </div>
    </div>

    <div class="panel" id="forecast-container" style="display: none; padding: 0;">
        <div class="panel-header">
            <span>Dati Oceanografici Alta Precisione</span>
            <span class="update-indicator" id="update-timer">Sync attivo</span>
        </div>
        <div class="timeline-wrapper" id="timeline"></div>
    </div>

    <div class="panel" id="fish-database-panel">
        <div class="panel-header">Database Specie Mediterraneo</div>
        <div class="panel-content">
            <div class="fish-grid" id="fish-grid"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const STORMGLASS_API_KEY = "e130086e-a827-11f1-9cea-0242ac120004-e1300904-a827-11f1-9cea-0242ac120004";

        const startSelect = document.getElementById('time-start');
        const endSelect = document.getElementById('time-end');
        for(let i = 5; i <= 20; i++) {
            let hourStr = i.toString().padStart(2, '0') + ":00";
            startSelect.innerHTML += `<option value="${i}">${hourStr} (Inizio)</option>`;
            endSelect.innerHTML += `<option value="${i}">${hourStr} (Fine)</option>`;
        }
        startSelect.value = "6";
        endSelect.value = "12";

        const map = L.map('map', { zoomControl: false }).setView([39.81, 15.78], 14);
        const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 18 });
        const openSeaMapLayer = L.tileLayer('https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png', { maxZoom: 18 });
        
        satelliteLayer.addTo(map);
        L.control.layers({ "Satellitare": satelliteLayer }, { "Isobate (Nautiche)": openSeaMapLayer }, { position: 'topleft' }).addTo(map);

        let marker;
        let savedMarkersLayer = L.layerGroup().addTo(map);
        let currentSpotData = null; 
        
        const dateInput = document.getElementById('target-date');
        const today = new Date();
        dateInput.value = today.toISOString().split('T')[0];
        dateInput.min = dateInput.value;

        function loadSavedSpots() {
            savedMarkersLayer.clearLayers();
            let spots = JSON.parse(localStorage.getItem('spot_personali') || "[]");
            let listHtml = "";
            let currentLatLng = marker ? marker.getLatLng() : null;

            spots.forEach((spot, index) => {
                if (currentLatLng) {
                    let spotLatLng = L.latLng(spot.lat, spot.lng);
                    let distanceMeters = currentLatLng.distanceTo(spotLatLng);
                    if (distanceMeters > 10000) return; 
                }

                let sm = L.circleMarker([spot.lat, spot.lng], {
                    color: '#eab308', fillColor: '#eab308', fillOpacity: 0.8, radius: 12, weight: 2
                }).addTo(savedMarkersLayer);
                
                let locationHtml = spot.location ? `<div style="font-size:10px; color:var(--text-muted); margin-bottom:6px;">📍 ${spot.location}</div>` : "";

                let popupTesto = `<b style="color:var(--windy-warn);">Spot #${index + 1}</b><br>
                                  ${locationHtml}
                                  <span style="font-size:11px;">🐟 Pesce: ${spot.pesce}<br>🎯 Tecnica: ${spot.tecnica}<br>🌊 Quota: ${spot.quota}</span>`;
                sm.bindPopup(popupTesto);

                listHtml += `
                    <div style="background-color: var(--bg-base); padding: 10px; margin-bottom: 8px; border: 1px solid var(--border-line); border-radius: 4px; display:flex; justify-content: space-between; align-items: center;">
                        <div style="flex: 1;">
                            <div style="color:var(--windy-warn); font-weight:bold; font-size:12px; margin-bottom:2px;">Spot #${index + 1}</div>
                            ${locationHtml}
                            <div style="font-size:11px; color:var(--text-muted); line-height:1.4;">
                                <span style="color:var(--text-main);">🐟 ${spot.pesce}</span><br>
                                🎯 ${spot.tecnica} | 🌊 ${spot.quota}
                            </div>
                        </div>
                        <div style="display:flex; gap:6px;">
                            <button onclick="selezionaSpotSalvato(${spot.lat}, ${spot.lng})" style="padding:8px 12px; font-size:10px; background-color:var(--windy-blue); width:auto;">PUNTA</button>
                            <button onclick="eliminaSpotSalvato(${index})" style="padding:8px 12px; font-size:10px; background-color:var(--windy-red); width:auto;">X</button>
                        </div>
                    </div>
                `;
            });

            const containerList = document.getElementById('saved-spots-list');
            if (spots.length === 0) {
                containerList.innerHTML = "<div style='font-size:11px; color:var(--text-muted); text-align:center;'>Nessuno spot salvato nel database.</div>";
            } else if (listHtml === "") {
                containerList.innerHTML = "<div style='font-size:11px; color:var(--text-muted); text-align:center;'>Nessuno spot salvato in un raggio di 10 km da questo punto.</div>";
            } else {
                containerList.innerHTML = listHtml;
            }
        }
        
        window.selezionaSpotSalvato = function(lat, lng) {
            map.setView([lat, lng], 15);
            if (marker) map.removeLayer(marker); 
            marker = L.marker([lat, lng]).addTo(map);
            fetchSpotData(lat, lng);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.eliminaSpotSalvato = function(index) {
            let spots = JSON.parse(localStorage.getItem('spot_personali') || "[]");
            spots.splice(index, 1);
            localStorage.setItem('spot_personali', JSON.stringify(spots));
            loadSavedSpots();
        }

        document.getElementById('btn-save-spot').addEventListener('click', () => {
            if (!marker || !currentSpotData) {
                alert("Tocca la mappa e attendi il calcolo meteo prima di salvare lo spot.");
                return;
            }
            let coords = marker.getLatLng();
            let locationName = currentSpotData.placeName || "Zona Costiera";
            
            let pesceTarget = prompt("Specie bersaglio (es. Dentice, Sarago):");
            if (pesceTarget === null) return; 
            
            let tecnicaSpot = prompt("Tecnica principale (es. Aspetto, Tana):");
            if (tecnicaSpot === null) return;
            
            let quotaSpot = prompt("Quota operativa (es. 15-20m):");
            if (quotaSpot === null) return;
            
            let nuovoSpot = { lat: coords.lat, lng: coords.lng, location: locationName, pesce: pesceTarget || "-", tecnica: tecnicaSpot || "-", quota: quotaSpot || "-" };
            
            let spots = JSON.parse(localStorage.getItem('spot_personali') || "[]");
            spots.push(nuovoSpot);
            localStorage.setItem('spot_personali', JSON.stringify(spots));
            
            alert("Spot salvato correttamente e associato a: " + locationName);
            loadSavedSpots(); 
        });

        const allGuns = [
            { id: "ares85", name: "Salvimar Ares 85", techniques: ["agguato", "razzolo"], checked: true },
            { id: "pred75", name: "Salvimar Predathor 75", techniques: ["tana", "schiuma"], checked: true },
            { id: "pred100", name: "Salvimar Predathor 100", techniques: ["aspetto", "caduta"], checked: true },
            { id: "cher90", name: "Cressi Cherokee 90", techniques: ["agguato", "aspetto"], checked: false },
            { id: "snip95", name: "Pathos Sniper 95", techniques: ["aspetto", "caduta"], checked: false },
            { id: "cay75", name: "Omer Cayman 75", techniques: ["tana", "schiuma"], checked: false },
            { id: "carb115", name: "C4 Mr. Carbon 115", techniques: ["aspetto", "blu"], checked: false }
        ];

        function renderGuns() {
            const container = document.getElementById('gun-inventory');
            container.innerHTML = allGuns.map(gun => `
                <label class="gun-item"><input type="checkbox" value="${gun.id}" class="gun-cb" ${gun.checked ? 'checked' : ''}>${gun.name} <span style="font-size:9px; color:var(--text-muted);">(${gun.techniques.join(', ')})</span></label>
            `).join('');
            document.querySelectorAll('.gun-cb').forEach(cb => { cb.addEventListener('change', updateAdvice); });
        }
        
        renderGuns();
        loadSavedSpots(); 

        // --- MOTORE VETTORIALE AVANZATO PER LE IMMAGINI DEI PESCI ---

            let svgContent = '';
            
            switch(type) {
                case 'spigola':
                    svgContent = `
                        <linearGradient id="gSpigola" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#475569"/>
                            <stop offset="40%" stop-color="#94a3b8"/>
                            <stop offset="100%" stop-color="#f8fafc"/>
                        </linearGradient>
                        <path d="M40,55 L5,30 L15,55 L5,80 Z" fill="url(#gSpigola)" stroke="#1e293b" stroke-width="1.5"/>
                        <path d="M100,25 Q130,25 150,40 Q170,45 190,55 Q160,70 120,75 Q80,75 40,55 Q60,35 100,25 Z" fill="url(#gSpigola)" stroke="#1e293b" stroke-width="2"/>

                        <circle cx="145" cy="45" r="3" fill="#0f172a" opacity="0.8"/> <!-- Macchia opercolare -->
                        <circle cx="165" cy="42" r="3" fill="#f8fafc" stroke="#1e293b"/><circle cx="166" cy="42" r="1.5" fill="#000"/>

                    `; break;
                case 'orata':
                    svgContent = `
                        <linearGradient id="gOrata" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#94a3b8"/><stop offset="50%" stop-color="#cbd5e1"/><stop offset="100%" stop-color="#ffffff"/>
                        </linearGradient>
                        <path d="M35,55 L5,20 L15,55 L5,90 Z" fill="url(#gOrata)" stroke="#1e293b" stroke-width="1.5"/>
                        <path d="M90,15 Q140,15 160,35 Q180,50 175,65 Q130,85 80,85 Q40,75 35,55 Q40,25 90,15 Z" fill="url(#gOrata)" stroke="#1e293b" stroke-width="2"/>

                        <circle cx="160" cy="42" r="3" fill="#fff" stroke="#1e293b"/><circle cx="161" cy="42" r="1.5" fill="#000"/>

                    `; break;
                case 'sarago':
                    svgContent = `
                        <linearGradient id="gSarago" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#cbd5e1"/><stop offset="100%" stop-color="#f8fafc"/>
                        </linearGradient>

                        <!-- Collare caudale nero -->

                        <circle cx="150" cy="42" r="3" fill="#fff" stroke="#1e293b"/><circle cx="151" cy="42" r="1.5" fill="#000"/>
                    `; break;
                case 'dentice':
                    svgContent = `
                        <linearGradient id="gDentice" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#f87171"/><stop offset="50%" stop-color="#fca5a5"/><stop offset="100%" stop-color="#fef2f2"/>
                        </linearGradient>
                        <path d="M35,55 L5,25 L15,55 L5,85 Z" fill="url(#gDentice)" stroke="#991b1b" stroke-width="1.5"/>
                        <path d="M90,20 Q140,20 160,30 L180,50 Q160,75 110,80 Q70,80 35,55 Q50,30 90,20 Z" fill="url(#gDentice)" stroke="#991b1b" stroke-width="2"/>
                        <path d="M100,20 L110,5 L140,25" fill="#fca5a5" stroke="#991b1b" stroke-width="1"/>

                    `; break;
                case 'cernia':
                    svgContent = `
                        <linearGradient id="gCernia" x1="0%" y1="0%" x2="0%" y2="100%">

                        <circle cx="80" cy="45" r="4" fill="#fbbf24" opacity="0.4"/><circle cx="110" cy="55" r="5" fill="#fbbf24" opacity="0.4"/><circle cx="130" cy="65" r="3" fill="#fbbf24" opacity="0.4"/>
                        <circle cx="155" cy="42" r="3" fill="#fff" stroke="#271c19"/><circle cx="156" cy="42" r="1.5" fill="#000"/>
                        <path d="M180,50 Q165,65 155,60" fill="none" stroke="#271c19" stroke-width="2"/>
                    `; break;
                case 'ricciola':
                    svgContent = `
                        <linearGradient id="gRicciola" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#64748b"/><stop offset="50%" stop-color="#cbd5e1"/><stop offset="100%" stop-color="#f8fafc"/>
                        </linearGradient>
                        <path d="M35,50 L-5,10 L15,50 L-5,90 Z" fill="url(#gRicciola)" stroke="#1e293b" stroke-width="1.5"/> <!-- Coda a falce -->
                        <path d="M90,25 Q150,30 175,45 Q195,55 175,65 Q130,75 80,75 Q40,65 35,50 Q50,35 90,25 Z" fill="url(#gRicciola)" stroke="#1e293b" stroke-width="2"/>
                        <path d="M40,50 Q120,45 170,45" stroke="#fef08a" stroke-width="4" fill="none" opacity="0.8"/> <!-- Striscia gialla -->
                        <circle cx="165" cy="43" r="3" fill="#fff" stroke="#1e293b"/><circle cx="166" cy="43" r="1.5" fill="#000"/>
                        <path d="M195,55 Q180,60 175,55" fill="none" stroke="#1e293b" stroke-width="1.5"/>
                    `; break;
                case 'corvina':
                    svgContent = `
                        <linearGradient id="gCorvina" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#451a03"/><stop offset="60%" stop-color="#78350f"/><stop offset="100%" stop-color="#d97706"/>
                        </linearGradient>
                        <path d="M35,55 L10,35 L20,55 L10,75 Z" fill="url(#gCorvina)" stroke="#1e293b" stroke-width="1.5"/>
                        <path d="M80,20 Q130,20 150,40 Q170,55 160,70 Q110,80 70,80 Q40,70 35,55 Q45,30 80,20 Z" fill="url(#gCorvina)" stroke="#1e293b" stroke-width="2"/>

        // --- GESTIONE RADAR, MAPPA E SPOT ---
        function loadSavedSpots() {
            savedMarkersLayer.clearLayers();
            let spots = JSON.parse(localStorage.getItem('spot_personali') || "[]");
            let listHtml = "";
            let currentLatLng = marker ? marker.getLatLng() : null;

            spots.forEach((spot, index) => {
                if (currentLatLng) {
                    let spotLatLng = L.latLng(spot.lat, spot.lng);
                    let distanceMeters = currentLatLng.distanceTo(spotLatLng);
                    if (distanceMeters > 10000) return; 
                }

                let sm = L.circleMarker([spot.lat, spot.lng], { color: '#eab308', fillColor: '#eab308', fillOpacity: 0.8, radius: 12, weight: 2 }).addTo(savedMarkersLayer);
                let locationHtml = spot.location ? `<div style="font-size:10px; color:var(--text-muted); margin-bottom:6px;">📍 ${spot.location}</div>` : "";
                let popupTesto = `<b style="color:var(--windy-warn);">Spot #${index + 1}</b><br>${locationHtml}<span style="font-size:11px;">🐟 Pesce: ${spot.pesce}<br>🎯 Tecnica: ${spot.tecnica}<br>🌊 Quota: ${spot.quota}</span>`;
                sm.bindPopup(popupTesto);

                listHtml += `
                    <div style="background-color: var(--bg-base); padding: 10px; margin-bottom: 8px; border: 1px solid var(--border-line); border-radius: 4px; display:flex; justify-content: space-between; align-items: center;">
                        <div style="flex: 1;">
                            <div style="color:var(--windy-warn); font-weight:bold; font-size:12px; margin-bottom:2px;">Spot #${index + 1}</div>
                            ${locationHtml}
                            <div style="font-size:11px; color:var(--text-muted); line-height:1.4;">
                                <span style="color:var(--text-main);">🐟 ${spot.pesce}</span><br>🎯 ${spot.tecnica} | 🌊 ${spot.quota}
                            </div>
                        </div>
                        <div style="display:flex; gap:6px;">
                            <button onclick="selezionaSpotSalvato(${spot.lat}, ${spot.lng})" style="padding:8px 12px; font-size:10px; background-color:var(--windy-blue); width:auto;">PUNTA</button>
                            <button onclick="eliminaSpotSalvato(${index})" style="padding:8px 12px; font-size:10px; background-color:var(--windy-red); width:auto;">X</button>
                        </div>
                    </div>
                `;
            });

            const containerList = document.getElementById('saved-spots-list');
            if (spots.length === 0) containerList.innerHTML = "<div style='font-size:11px; color:var(--text-muted); text-align:center;'>Nessuno spot salvato nel database.</div>";
            else if (listHtml === "") containerList.innerHTML = "<div style='font-size:11px; color:var(--text-muted); text-align:center;'>Nessuno spot a meno di 10km.</div>";
            else containerList.innerHTML = listHtml;
        }

        window.selezionaSpotSalvato = function(lat, lng) {
            map.setView([lat, lng], 15);
            if (marker) map.removeLayer(marker); 
            marker = L.marker([lat, lng]).addTo(map);
            fetchSpotData(lat, lng);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.eliminaSpotSalvato = function(index) {
            let spots = JSON.parse(localStorage.getItem('spot_personali') || "[]");
            spots.splice(index, 1);
            localStorage.setItem('spot_personali', JSON.stringify(spots));
            loadSavedSpots();
        }

        function getTactics(waveAvg, depth) {
            if (waveAvg <= 0.3) return depth === "basso" ? { tech: "agguato", cond: "Mare piatto" } : { tech: "aspetto", cond: "Calma e acqua limpida" };
            if (waveAvg <= 0.7) return depth === "basso" ? { tech: "schiuma", cond: "Risacca attiva" } : { tech: "razzolo", cond: "Acqua mossa in superficie" };
            return { tech: "tana", cond: "Condizioni difficili o mare mosso" };
        }

        function updateAdvice() {
            if (!marker || !currentSpotData) return; 
            const startH = parseInt(document.getElementById('time-start').value);
            let endH = parseInt(document.getElementById('time-end').value);
            if (endH <= startH) endH = startH + 1; 
            const depth = document.getElementById('depth-selector').value;
            
            const selectedGunIds = Array.from(document.querySelectorAll('.gun-cb:checked')).map(cb => cb.value);
            const selectedGuns = allGuns.filter(g => selectedGunIds.includes(g.id));

            let htmlOutput = "";
            let warningBanner = currentSpotData.isFallback ? `<div style="background-color: rgba(234, 179, 8, 0.15); border: 1px solid var(--windy-warn); color: var(--windy-warn); padding: 8px; border-radius: 4px; font-size: 11px; margin-bottom: 10px; text-align: left;">⚠️ Punto chiuso. Dati meteo/termici stimati in fallback.</div>` : "";

            if (selectedGuns.length === 0) {
                htmlOutput = "Nessuna arma selezionata nell'inventario.";
            } else {
                let duration = endH - startH;
                let midTime = Math.floor((startH + endH) / 2);
                let waveSum1=0, windSum1=0, tempSum1=0, count1=0, waveSum2=0, windSum2=0, tempSum2=0, count2=0;

                for(let i = startH; i < endH; i++) { 
                    let w = currentSpotData.isFallback ? ((currentSpotData.winds[i]||0) < 5 ? 0.1 : ((currentSpotData.winds[i]||0) < 12 ? 0.4 : 1.0)) : (currentSpotData.waves[i] || 0);
                    let wind = currentSpotData.winds[i] || 0;
                    let tWater = currentSpotData.waterTemps[i] || 20; 

                    if (i < midTime || duration <= 3) { waveSum1+=w; windSum1+=wind; tempSum1+=tWater; count1++; } 
                    else { waveSum2+=w; windSum2+=wind; tempSum2+=tWater; count2++; }
                }
                
                let wave1 = count1>0?waveSum1/count1:0, wind1 = count1>0?windSum1/count1:0, temp1 = count1>0?tempSum1/count1:20;
                let wave2 = count2>0?waveSum2/count2:0, wind2 = count2>0?windSum2/count2:0, temp2 = count2>0?tempSum2/count2:20;
                let totalWaveAvg = (wave1 + wave2) / (count2 > 0 ? 2 : 1), totalWindAvg = (wind1 + wind2) / (count2 > 0 ? 2 : 1), totalTempAvg = (temp1 + temp2) / (count2 > 0 ? 2 : 1);

                let score = 50; 
                if (startH <= 7 || endH >= 18) score += 20; 
                if (depth === "basso") { if (totalWaveAvg >= 0.3 && totalWaveAvg <= 0.8) score += 25; else if (totalWaveAvg < 0.2) score -= 15; else if (totalWaveAvg > 1.2) score -= 30; } 
                else if (depth === "medio") { if (totalWaveAvg <= 0.5) score += 15; else if (totalWaveAvg > 1.0) score -= 25; } 
                else { if (totalWaveAvg < 0.4) score += 20; else if (totalWaveAvg > 0.8) score -= 35; }
                if (totalWindAvg > 15) score -= 20;
                let finalScore = Math.round(Math.max(0, Math.min(100, score)) / 5) * 5; 
                let scoreColor = finalScore < 45 ? 'var(--windy-red)' : (finalScore <= 70 ? 'var(--windy-warn)' : 'var(--windy-green)');

                htmlOutput += `
                    <div class="data-grid">
                        <div class="score-box">
                            <div class="score-val" style="color:${scoreColor}">${finalScore}%</div><div class="score-lbl">Pescosità</div>
                        </div>
                        <div class="astro-box">
                            <div class="astro-row"><span>🌅 Alba</span> <span>${currentSpotData.sunriseTime}</span></div>
                            <div class="astro-row"><span>🌇 Tramonto</span> <span>${currentSpotData.sunsetTime}</span></div>
                        </div>
                    </div>
                    ${warningBanner}
                    <div style="padding: 8px; border-left: 3px solid var(--windy-warn); background: rgba(234, 179, 8, 0.05); margin-bottom: 15px; text-align: left;">
                        <b style="color:var(--windy-warn);">🌡️ Analisi Termica:</b> <span style="font-size:11px; color:var(--text-main);">${getWetsuitAdvice(totalTempAvg, depth)}</span>
                    </div>
                `;

                if (duration <= 3) {
                    let t = getTactics(totalWaveAvg, depth);
                    let gun = selectedGuns.find(g => g.techniques.includes(t.tech)) || selectedGuns[0];
                    let isFb = !gun.techniques.includes(t.tech);
                    let borderCol = isFb ? "var(--windy-red)" : "var(--windy-green)";
                    
                    htmlOutput += `
                        <div class="tactic-box" style="text-align:left;">
                            <div style="margin-bottom:8px; font-size:13px;"><b style="color:var(--windy-blue);">CONSIGLIO TATTICO: ${t.tech.toUpperCase()}</b> (${t.cond})</div>
                            <div style="margin-bottom:12px; font-size:11px; line-height:1.5; color:var(--text-muted);">${extendedTechDetails[t.tech]}</div>
                            <div style="padding: 8px; border: 1px ${isFb ? 'dashed' : 'solid'} ${borderCol}; border-radius: 4px; background: ${isFb ? 'rgba(239, 68, 68, 0.1)' : 'rgba(16, 185, 129, 0.1)'};">
                                <b>${isFb ? 'Arma di Ripiego' : 'Arma Perfetta'}: ${gun.name}</b><br>
                                <span style="font-size: 10px; color: ${borderCol};">${isFb ? 'Adattamento necessario' : 'Ottimizzata per: ' + t.tech.toUpperCase()}</span>
                            </div>
                        </div>
                    `;
                } else {
                    let t1 = getTactics(wave1, depth), t2 = getTactics(wave2, depth);
                    let gun1 = selectedGuns.find(g => g.techniques.includes(t1.tech)) || selectedGuns[0];
                    let gun2 = selectedGuns.find(g => g.techniques.includes(t2.tech) && g.id !== gun1.id) || selectedGuns.find(g => g.techniques.includes(t2.tech)) || selectedGuns[selectedGuns.length - 1];

                    htmlOutput += `
                        <div class="tactic-box" style="text-align:left;">
                            <div style="margin-bottom:10px; font-weight:600; color:var(--windy-blue);">Sessione lunga (${duration} ore). Tattica:</div>
                            
                            <div style="margin-bottom:12px; padding: 10px; border-left: 3px solid var(--windy-blue); background: rgba(14, 165, 233, 0.05);">
                                <b style="color:var(--text-main); font-size:13px;">Fase 1 (${startH}:00 - ${midTime}:00)</b><br>
                                <span style="color:var(--windy-blue); font-weight:bold; font-size:11px;">Tecnica: ${t1.tech.toUpperCase()}</span><br>
                                <span style="font-size:11px; display:block; margin:4px 0 8px 0; line-height:1.4; color:var(--text-muted);">${extendedTechDetails[t1.tech]}</span>
                                <span style="color:${!gun1.techniques.includes(t1.tech) ? 'var(--windy-red)' : 'var(--windy-green)'}; font-weight:bold;">🎯 Arma: ${gun1.name}</span>
                            </div>

                            <div style="padding: 10px; border-left: 3px solid var(--windy-blue); background: rgba(14, 165, 233, 0.05);">
                                <b style="color:var(--text-main); font-size:13px;">Fase 2 (${midTime}:00 - ${endH}:00)</b><br>
                                <span style="color:var(--windy-blue); font-weight:bold; font-size:11px;">Tecnica: ${t2.tech.toUpperCase()}</span><br>
                                <span style="font-size:11px; display:block; margin:4px 0 8px 0; line-height:1.4; color:var(--text-muted);">${extendedTechDetails[t2.tech]}</span>
                                <span style="color:${!gun2.techniques.includes(t2.tech) ? 'var(--windy-red)' : 'var(--windy-green)'}; font-weight:bold;">🎯 Arma: ${gun2.name}</span>
                            </div>
                        </div>
                    `;
                }
            }

            document.getElementById('advice-box').innerHTML = `
                <div class="panel-header" style="background-color: transparent; border-bottom: 1px solid var(--border-line); margin-bottom:10px;">
                    <span style="color:var(--windy-blue);">${currentSpotData.placeName}</span>
                </div>
                <div class="panel-content" style="padding-top:0;">${htmlOutput}</div>
            `;
        }

        // --- SISTEMA PREVISIONI OCEANOGRAFICHE ---
        async function getValidMarineData(baseLat, baseLng, sDate) {
            const offsets = [[0, 0], [0, -0.05], [0, 0.05], [-0.05, 0], [0.05, 0]];
            for (let off of offsets) {
                let testLat = baseLat + off[0]; let testLng = baseLng + off[1];
                try {
                    let res = await fetch(`https://marine-api.open-meteo.com/v1/marine?latitude=${testLat}&longitude=${testLng}&hourly=wave_height,wave_direction,wave_period,ocean_temperature&timezone=auto&start_date=${sDate}&end_date=${sDate}`);
                    if (!res.ok) continue; let data = await res.json();
                    if (data.hourly && data.hourly.wave_height && data.hourly.wave_height.some(val => val !== null)) return data; 
                } catch(e) {}
            }
            return null; 
        }

        async function getProTides(lat, lng, sDate) {
            let cacheKey = `tide_${Math.round(lat*10)/10}_${Math.round(lng*10)/10}_${sDate}`;
            let cachedDataStr = localStorage.getItem(cacheKey);
            if (cachedDataStr) {
                let cd = JSON.parse(cachedDataStr);
                if (((new Date().getTime() - (cd.timestamp || 0)) / 60000) < 144) return cd.data;
            }
            try {
                let dStart = new Date(sDate); dStart.setDate(dStart.getDate() - 1);
                let dEnd = new Date(sDate); dEnd.setDate(dEnd.getDate() + 2);
                let res = await fetch(`https://api.stormglass.io/v2/tide/extremes/point?lat=${lat}&lng=${lng}&start=${dStart.toISOString().split('T')[0]}&end=${dEnd.toISOString().split('T')[0]}`, { headers: { 'Authorization': STORMGLASS_API_KEY } });
                if (res.ok) {
                    let json = await res.json();
                    if(json.data) { localStorage.setItem(cacheKey, JSON.stringify({timestamp: new Date().getTime(), data: json.data})); return json.data; }
                }
            } catch(e) {}
            return null;
        }

        async function fetchSpotData(lat, lng) {
            const dateObj = new Date(dateInput.value);
            const sDate = dateInput.value;
            const moonData = getMoonData(dateObj); 

            document.getElementById('forecast-container').style.display = 'none';
            document.getElementById('advice-box').innerHTML = "<div class='panel-content' style='text-align:center; color: var(--windy-blue); font-size: 11px;'>📡 Scansione dati marini e termici...</div>";
            
            try {
                let placeName = "Coordinate Radar";
                try {
                    const geoRes = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json`);
                    const geoData = await geoRes.json();
                    placeName = geoData.name || geoData.address.village || geoData.address.town || "Zona Costiera";
                } catch(e) {}

                const wRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&hourly=wind_speed_10m,wind_direction_10m,wind_gusts_10m,weather_code,temperature_2m&daily=sunrise,sunset&timezone=auto&start_date=${sDate}&end_date=${sDate}&wind_speed_unit=kn&models=best_match`);
                const wData = await wRes.json();
                
                let mData = await getValidMarineData(lat, lng, sDate);
                let tideExtremes = await getProTides(lat, lng, sDate);

                let isFallback = false;
                if (!mData) {
                    isFallback = true;
                    mData = { hourly: { wave_height: new Array(24).fill(null), wave_direction: new Array(24).fill(null), wave_period: new Array(24).fill(null), ocean_temperature: new Array(24).fill(null) } };
                }

                let waterTemps = mData.hourly.ocean_temperature;
                if (isFallback || !waterTemps || waterTemps[12] === null) waterTemps = wData.hourly.temperature_2m.map(t => t - 3); 

                let srTime = "-", ssTime = "-";
                if(wData.daily && wData.daily.sunrise) srTime = new Date(wData.daily.sunrise[0]).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                if(wData.daily && wData.daily.sunset) ssTime = new Date(wData.daily.sunset[0]).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

                currentSpotData = {
                    placeName: placeName, isFallback: isFallback, sDateStr: sDate, 
                    winds: wData.hourly.wind_speed_10m, weather: wData.hourly.weather_code, waterTemps: waterTemps,
                    sunriseTime: srTime, sunsetTime: ssTime,
                    waves: mData.hourly.wave_height, waveDir: mData.hourly.wave_direction, wavePeriod: mData.hourly.wave_period,
                    tideExtremes: tideExtremes, moonAge: moonData.age 
                };

                if (marker) map.removeLayer(marker);
                
                const startH = parseInt(document.getElementById('time-start').value);
                const windDirVal = wData.hourly.wind_direction_10m[startH] || 0;
                let currentArrow = isFallback || mData.hourly.wave_direction[startH] === null ? "-" : getDirectionArrow(mData.hourly.wave_direction[startH]);

                marker = L.marker([lat, lng]).bindPopup(`<div style="font-size:11px;"><b>${placeName}</b><br>Vento: ${getWindDirectionName(windDirVal)}<br>Mare: ${currentArrow}</div>`).addTo(map);
                marker.openPopup();

                buildTimeline(currentSpotData);
                document.getElementById('forecast-container').style.display = 'block';
                updateAdvice(); 
                loadSavedSpots();

            } catch (error) {
                document.getElementById('advice-box').innerHTML = "<div class='panel-content' style='text-align:center; color: var(--windy-red); font-size: 11px;'>Errore di rete. Assicurati di essere connesso a Internet.</div>";
            }
        }

        function buildTimeline(data) {
            const container = document.getElementById('timeline');
            let isProTide = data.tideExtremes !== null;
            let rowTime = '<div class="t-row"><div class="t-label">Ora</div>';
            let rowMeteo = '<div class="t-row"><div class="t-label">Cielo</div>';
            let rowWind = '<div class="t-row"><div class="t-label">Vento (kn)</div>';
            let rowWave = '<div class="t-row"><div class="t-label">Onda (m)</div>';
            let rowPeriod = '<div class="t-row"><div class="t-label">Period (s)</div>';
            let rowTide = `<div class="t-row" style="border:none;"><div class="t-label">${isProTide ? 'Marea (PRO)' : 'Marea (Luna)'}</div>`;

            let dateParts = data.sDateStr.split('-');

            for (let i = 5; i <= 20; i++) {
                let timeStr = i.toString().padStart(2, '0') + ':00';
                let icon = parseWeather(data.weather[i]);
                let windSp = Math.round(data.winds[i]);
                let waveH = (data.waves[i] !== null && data.waves[i] !== undefined) ? data.waves[i].toFixed(1) : '-';
                let dirArrow = getDirectionArrow(data.waveDir[i]);
                let period = (data.waves[i] !== null && data.wavePeriod[i] !== null) ? Math.round(data.wavePeriod[i]) + 's' : '-';
                
                let tideStr = "-";
                if (isProTide) {
                    let targetMs = new Date(dateParts[0], dateParts[1] - 1, dateParts[2], i, 0, 0).getTime();
                    let nextExtreme = data.tideExtremes.find(ex => new Date(ex.time).getTime() > targetMs);
                    if (nextExtreme) tideStr = nextExtreme.type === "high" ? "<span style='color:var(--windy-blue); font-weight:bold;'>🌊 IN</span>" : "<span style='color:var(--windy-red); font-weight:bold;'>📉 OUT</span>";
                } else {
                    let adjustedHour = (i - ((data.moonAge * 24 * 0.84) % 12) + 24) % 12;
                    tideStr = adjustedHour < 6 ? "<span style='color:var(--windy-blue); font-weight:bold;'>🌊 IN</span>" : "<span style='color:var(--windy-red); font-weight:bold;'>📉 OUT</span>";
                }

                rowTime += `<div class="t-cell" style="color:var(--text-main); font-weight:600;">${timeStr}</div>`;
                rowMeteo += `<div class="t-cell">${icon}</div>`;
                rowWind += `<div class="t-cell">${windSp}</div>`;
                rowWave += `<div class="t-cell" style="color:var(--windy-blue);">${waveH} ${dirArrow === '-' ? '' : dirArrow}</div>`;
                rowPeriod += `<div class="t-cell">${period}</div>`;
                rowTide += `<div class="t-cell" style="font-size:10px;">${tideStr}</div>`;
            }
            container.innerHTML = rowTime + '</div>' + rowMeteo + '</div>' + rowWind + '</div>' + rowWave + '</div>' + rowPeriod + '</div>' + rowTide + '</div>';
        }

        map.on('click', e => { 
            if (marker) map.removeLayer(marker); 
            marker = L.marker([e.latlng.lat, e.latlng.lng]).addTo(map); 
            fetchSpotData(e.latlng.lat, e.latlng.lng); 
        });
        
        document.getElementById('btn-gps').addEventListener('click', () => {
            if (navigator.geolocation) navigator.geolocation.getCurrentPosition(pos => {
                map.setView([pos.coords.latitude, pos.coords.longitude], 13);
                if (marker) map.removeLayer(marker); 
                marker = L.marker([pos.coords.latitude, pos.coords.longitude]).addTo(map);
                fetchSpotData(pos.coords.latitude, pos.coords.longitude);
            });
        });
    </script>
</body>
